<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="stylesheet" href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap">
    <title>技术洞察 · 大模型训练与推理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 15px; }
        body {
            font-family: "Noto Serif SC", "Source Serif SC", "Songti SC", "SimSun", Georgia, serif;
            background: #f7f5f0; color: #23211c; line-height: 1.75;
            -webkit-font-smoothing: antialiased;
        }
        .wrap { max-width: 860px; margin: 0 auto; padding: 56px 24px 80px; }
        .masthead { text-align: center; padding-bottom: 28px; border-bottom: 2px solid #23211c; margin-bottom: 40px; }
        .masthead h1 { font-size: 2.2rem; font-weight: 900; letter-spacing: .35em; text-indent: .35em; margin-bottom: 10px; }
        .masthead .sub { font-size: .78rem; color: #8d8578; letter-spacing: .3em; text-indent: .3em; }
        .latest { border-bottom: 1px solid #d9d3c6; padding-bottom: 32px; margin-bottom: 40px; }
        .latest .issue { font-size: .72rem; color: #a4342a; letter-spacing: .25em; font-weight: 600; margin-bottom: 10px; }
        .latest h2 { font-size: 1.35rem; font-weight: 900; line-height: 1.55; margin-bottom: 8px; }
        .latest h2 a { color: #23211c; text-decoration: none; }
        .latest h2 a:hover { color: #a4342a; }
        .latest .date { font-size: .78rem; color: #8d8578; letter-spacing: .12em; }
        .arch-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; }
        .arch-head .t { font-size: .8rem; color: #a4342a; letter-spacing: .3em; font-weight: 600; }
        .arch-head .n { font-size: .72rem; color: #8d8578; letter-spacing: .1em; }
        .months { columns: 2; column-gap: 48px; }
        .month { break-inside: avoid; margin-bottom: 32px; }
        .month h3 { font-size: .88rem; font-weight: 700; color: #6f695e; letter-spacing: .15em; border-bottom: 1px solid #d9d3c6; padding-bottom: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .month h3 .cnt { font-weight: 400; color: #a49c8f; font-size: .72rem; }
        .month ul { list-style: none; }
        .month li { padding: 5px 0; font-size: .88rem; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
        .month li a { color: #23211c; text-decoration: none; flex: 1; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .month li a:hover { color: #a4342a; }
        .month li .d { color: #a49c8f; font-size: .72rem; white-space: nowrap; }
        .footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid #d9d3c6; text-align: center; font-size: .72rem; color: #a49c8f; letter-spacing: .15em; }
        #loading { text-align: center; color: #8d8578; padding: 60px 0; font-size: .9rem; letter-spacing: .2em; }
        @media (max-width: 640px) {
            .wrap { padding: 40px 16px 56px; }
            .masthead h1 { font-size: 1.6rem; }
            .months { columns: 1; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <header class="masthead">
        <h1>技 术 洞 察</h1>
        <div class="sub" id="masthead-sub">大模型训练与推理 · 每日一期</div>
    </header>
    <section class="latest" id="latest" style="display:none;">
        <div class="issue" id="latest-issue"></div>
        <h2><a id="latest-link" href="#"></a></h2>
        <div class="date" id="latest-date"></div>
    </section>
    <div class="arch-head">
        <span class="t">往 期 存 档</span>
        <span class="n" id="arch-count"></span>
    </div>
    <div class="months" id="months"></div>
    <div id="loading">载 入 中 …</div>
    <div class="footer">老许 AI 研究室 · 每日 06:30 自动生成</div>
</div>

<script>
// 数据/页面分离：首页内容全部来自 data/index.json
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function main() {
  const idx = await (await fetch('data/index.json')).json();
  const reports = idx.reports || [];   // 新的在前
  const total = reports.length;

  if (total) {
    document.getElementById('masthead-sub').textContent =
      `大模型训练与推理 · 自 ${reports[reports.length-1].date} 起 · 共 ${total} 期`;
    const r = reports[0];
    document.getElementById('latest-issue').textContent = `第 ${total} 期 · 最新`;
    const a = document.getElementById('latest-link');
    a.textContent = r.title;
    a.href = `report.html?d=${r.date}`;
    document.getElementById('latest-date').textContent = r.date;
    document.getElementById('latest').style.display = '';
  }
  document.getElementById('arch-count').textContent = `共 ${total} 期`;

  const byMonth = {};
  for (const r of reports) {
    const ym = r.date.slice(0, 7);
    (byMonth[ym] = byMonth[ym] || []).push(r);
  }
  const months = Object.keys(byMonth).sort().reverse();
  document.getElementById('months').innerHTML = months.map(ym => {
    const [y, m] = ym.split('-');
    const items = byMonth[ym].map(r =>
      `<li><a href="report.html?d=${r.date}">${esc(r.title)}</a><span class="d">${parseInt(r.date.slice(8,10))}日</span></li>`
    ).join('');
    return `<section class="month">
      <h3><span class="ym">${y} 年 ${parseInt(m)} 月</span><span class="cnt">${byMonth[ym].length} 期</span></h3>
      <ul>${items}</ul>
    </section>`;
  }).join('');

  document.getElementById('loading').style.display = 'none';
}
main().catch(e => {
  document.getElementById('loading').textContent = '索引加载失败：' + e.message;
});
</script>
</body>
</html>
